################################################################################
# Orchestration Relationships
#
# Composition edges describe skills that invoke other skills at runtime through
# the workflow-runtime. They are documentation only and are intentionally kept
# separate from the dependencies graph so the dependency graph remains acyclic.
# A composition edge does not imply a build-time or package-level dependency.
################################################################################

composition:

  recon:
    orchestrates:
      - dns-enumeration
      - subdomain-discovery
      - port-discovery
      - tls-analysis
      - content-discovery
      - fingerprinting
      - virtual-host-discovery
      - api-discovery
      - endpoint-enumeration
      - asset-discovery
    mechanism: workflow-runtime
    consolidated_by: asset-discovery

