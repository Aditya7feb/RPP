[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rpp-runtime"
version = "0.1.0"
description = "Executable integration between the RPP architecture and a Kali MCP server."
requires-python = ">=3.11"
readme = "README.md"
dependencies = []

# The core runtime and the dry-run first example use the standard library only.
# Optional extras enable live operation.
[project.optional-dependencies]
http = ["httpx>=0.27"]   # required for the live Streamable HTTP / SSE MCP transport
yaml = ["PyYAML>=6.0"]    # optional: full YAML config support (a minimal subset parser is built in)
mcp = ["mcp>=1.0"]        # optional: official MCP SDK, for future transport backends
dev = ["httpx>=0.27", "PyYAML>=6.0"]

[tool.setuptools.packages.find]
where = ["."]
include = ["rpp*"]
